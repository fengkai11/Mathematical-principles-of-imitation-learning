<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <style>
      .title{font:700 28px sans-serif;fill:#222}.sub{font:18px sans-serif;fill:#555}.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.focus{fill:#eef6ff;stroke:#2563eb;stroke-width:2;rx:18}.use{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:18}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:18}.bt{font:700 20px sans-serif;fill:#222}.txt{font:16px sans-serif;fill:#333}.f{font:18px serif;fill:#111}.arr{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="600" y="42" text-anchor="middle" class="title">图6P-1 第六篇数学主线：从动作模仿到世界预测</text>
  <text x="600" y="75" text-anchor="middle" class="sub">第六篇不是额外讲认知架构，而是把策略从“输出动作”推进到“预测动作后果”</text>

  <rect x="70" y="150" width="230" height="150" class="box"/>
  <text x="185" y="185" text-anchor="middle" class="bt">动作策略</text>
  <text x="100" y="225" class="txt">回答：现在怎么做？</text>
  <text x="100" y="258" class="f">πθ(a_t | o≤t, q)</text>

  <rect x="365" y="150" width="260" height="150" class="focus"/>
  <text x="495" y="185" text-anchor="middle" class="bt">动作后果预测</text>
  <text x="395" y="225" class="txt">回答：这样做会怎样？</text>
  <text x="395" y="258" class="f">p(h_{t+1} | h_t, a_t)</text>

  <rect x="690" y="150" width="260" height="150" class="use"/>
  <text x="820" y="185" text-anchor="middle" class="bt">世界预测模型</text>
  <text x="720" y="225" class="txt">预测未来 latent / 任务变量</text>
  <text x="720" y="258" class="f">ĥ_{t+1}=Fθ(h_t,a_t)</text>

  <rect x="430" y="365" width="340" height="115" class="warn"/>
  <text x="600" y="402" text-anchor="middle" class="bt">服务策略执行</text>
  <text x="465" y="438" class="txt">候选动作评估 / 短期 rollout / 风险预测 / 失败恢复</text>

  <path d="M300 225 C330 225 335 225 365 225" class="arr"/>
  <path d="M625 225 C655 225 660 225 690 225" class="arr"/>
  <path d="M820 300 C820 345 735 365 685 365" class="arr"/>
  <path d="M515 365 C470 340 420 310 370 275" class="arr"/>

  <text x="332" y="210" class="txt">不足</text>
  <text x="650" y="210" class="txt">建模</text>
  <text x="795" y="345" class="txt">使用</text>
  <text x="260" y="355" class="txt">反馈到动作选择</text>

  <text x="600" y="525" text-anchor="middle" class="sub">读者要记住：本篇主线是动作后果预测，不是快慢系统或认知架构综述。</text>
</svg>
