<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24292f"/></marker>
    <style>
      .title{font:700 30px Arial,'Microsoft YaHei',sans-serif;fill:#24292f}.sub{font:18px Arial,'Microsoft YaHei',sans-serif;fill:#57606a}.axis{stroke:#24292f;stroke-width:3;marker-end:url(#arrow)}.curve{stroke:#0969da;stroke-width:4;fill:none}.risk{stroke:#cf222e;stroke-width:4;fill:none;stroke-dasharray:10 8}.box{fill:#f6f8fa;stroke:#8c959f;stroke-width:2;rx:16;ry:16}.warn{fill:#ffebe9;stroke:#cf222e;stroke-width:2;rx:16;ry:16}.txt{font:18px Arial,'Microsoft YaHei',sans-serif;fill:#24292f}.small{font:15px Arial,'Microsoft YaHei',sans-serif;fill:#57606a}.formula{font:16px Arial,'Microsoft YaHei',sans-serif;fill:#6e7781}
    </style>
  </defs>
  <text x="640" y="46" text-anchor="middle" class="title">图18-5 表达能力与工程风险</text>
  <text x="640" y="80" text-anchor="middle" class="sub">更强模型可能降低拟合误差，但未必降低真实部署风险</text>

  <line x1="130" y1="560" x2="740" y2="560" class="axis"/>
  <line x1="130" y1="560" x2="130" y2="140" class="axis"/>
  <text x="435" y="610" text-anchor="middle" class="txt">模型表达能力 / 系统复杂度</text>
  <text x="55" y="350" text-anchor="middle" class="txt" transform="rotate(-90 55 350)">风险 / 误差</text>

  <path d="M160 220 C280 250 420 310 705 470" class="curve"/>
  <text x="540" y="430" class="small" fill="#0969da">拟合误差可能下降</text>

  <path d="M160 500 C300 450 430 420 520 430 C610 445 670 485 710 535" class="risk"/>
  <text x="505" y="390" class="small" fill="#cf222e">部署风险可能先降后升</text>

  <rect x="800" y="150" width="360" height="310" class="box"/>
  <text x="980" y="190" text-anchor="middle" class="txt">部署风险分解</text>
  <text x="980" y="235" text-anchor="middle" class="formula">R_deploy = R_fit + R_ood</text>
  <text x="980" y="265" text-anchor="middle" class="formula">+ R_latency + R_safety + R_debug</text>
  <text x="980" y="315" text-anchor="middle" class="small">表达能力主要影响 R_fit</text>
  <text x="980" y="350" text-anchor="middle" class="small">大模型可能提高延迟和调试成本</text>
  <text x="980" y="385" text-anchor="middle" class="small">数据不足时 OOD 和安全风险仍会放大</text>

  <rect x="800" y="505" width="360" height="85" class="warn"/>
  <text x="980" y="538" text-anchor="middle" class="txt">工程判断</text>
  <text x="980" y="568" text-anchor="middle" class="small">先看失败模式，再决定是否升级模型。</text>
</svg>
