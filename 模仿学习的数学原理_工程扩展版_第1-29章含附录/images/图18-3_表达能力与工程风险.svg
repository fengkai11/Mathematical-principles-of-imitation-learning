<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#24292f"/>
    </marker>
  </defs>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700">图18-3 表达能力提升不等于工程风险下降</text>
    <text x="600" y="86" text-anchor="middle" font-size="18" fill="#57606a">复杂模型可能降低拟合误差，但同时增加延迟、安全、调试和分布外风险</text>

    <line x1="145" y1="500" x2="1050" y2="500" stroke="#24292f" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="145" y1="500" x2="145" y2="130" stroke="#24292f" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="548" text-anchor="middle" font-size="20" font-weight="700">模型表达能力 / 架构复杂度</text>
    <text x="55" y="315" text-anchor="middle" font-size="20" font-weight="700" transform="rotate(-90 55 315)">工程总体风险</text>

    <polyline points="170,430 280,395 390,350 500,300 610,255 720,215 830,190 940,175 1040,165" fill="none" stroke="#24292f" stroke-width="4"/>
    <text x="890" y="150" text-anchor="middle" font-size="18" fill="#24292f">拟合能力更强</text>

    <polyline points="170,270 280,230 390,205 500,200 610,220 720,270 830,350 940,445 1040,485" fill="none" stroke="#57606a" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="820" y="420" text-anchor="middle" font-size="18" fill="#57606a">总风险可能回升</text>

    <circle cx="280" cy="230" r="8" fill="#24292f"/>
    <text x="280" y="205" text-anchor="middle" font-size="17">BC baseline</text>
    <circle cx="470" cy="200" r="8" fill="#24292f"/>
    <text x="470" y="175" text-anchor="middle" font-size="17">ACT / 生成式动作头</text>
    <circle cx="675" cy="250" r="8" fill="#24292f"/>
    <text x="675" y="225" text-anchor="middle" font-size="17">Transformer / 长历史</text>
    <circle cx="900" cy="405" r="8" fill="#24292f"/>
    <text x="900" y="380" text-anchor="middle" font-size="17">VLA / 大模型策略</text>

    <rect x="210" y="55" width="780" height="56" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <text x="600" y="90" text-anchor="middle" font-size="17">选型不是寻找最强模型，而是寻找任务收益和部署风险的平衡点</text>
  </g>
</svg>
