<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24292f"/></marker>
    <style>
      .title{font:700 30px Arial,'Microsoft YaHei',sans-serif;fill:#24292f}.sub{font:18px Arial,'Microsoft YaHei',sans-serif;fill:#57606a}
      .box{fill:#f6f8fa;stroke:#8c959f;stroke-width:2;rx:16;ry:16}.wm{fill:#dafbe1;stroke:#1a7f37;stroke-width:2;rx:16;ry:16}.wam{fill:#fff8c5;stroke:#9a6700;stroke-width:2;rx:16;ry:16}.jepa{fill:#ddf4ff;stroke:#0969da;stroke-width:2;rx:16;ry:16}
      .txt{font:18px Arial,'Microsoft YaHei',sans-serif;fill:#24292f}.small{font:15px Arial,'Microsoft YaHei',sans-serif;fill:#57606a}.formula{font:16px Arial,'Microsoft YaHei',sans-serif;fill:#6e7781}.arrow{stroke:#24292f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="640" y="46" text-anchor="middle" class="title">图20-1 World Model、WAM 与 JEPA 的关系</text>
  <text x="640" y="80" text-anchor="middle" class="sub">三者的区别不在名字，而在预测对象、条件变量和训练压力</text>

  <rect x="70" y="160" width="245" height="120" class="box"/>
  <text x="192" y="202" text-anchor="middle" class="txt">世界表示</text>
  <text x="192" y="235" text-anchor="middle" class="formula">h_t</text>

  <rect x="425" y="120" width="310" height="130" class="wm"/>
  <text x="580" y="160" text-anchor="middle" class="txt">World Model</text>
  <text x="580" y="196" text-anchor="middle" class="small">预测世界如何演化</text>
  <text x="580" y="226" text-anchor="middle" class="formula">p(h_{t+1}|h_t)</text>

  <rect x="425" y="310" width="310" height="130" class="wam"/>
  <text x="580" y="350" text-anchor="middle" class="txt">World Action Model</text>
  <text x="580" y="386" text-anchor="middle" class="small">预测执行动作后的未来</text>
  <text x="580" y="416" text-anchor="middle" class="formula">p(h_{t+1}|h_t,a_t)</text>

  <rect x="425" y="500" width="310" height="130" class="jepa"/>
  <text x="580" y="540" text-anchor="middle" class="txt">JEPA 式表示预测</text>
  <text x="580" y="576" text-anchor="middle" class="small">预测表示，不重建像素</text>
  <text x="580" y="606" text-anchor="middle" class="formula">L_JEPA = ||g(h_t,a_t)-sg(h_{t+1})||²</text>

  <rect x="870" y="170" width="285" height="90" class="box"/>
  <text x="1012" y="205" text-anchor="middle" class="txt">未来世界表示</text>
  <text x="1012" y="233" text-anchor="middle" class="formula">h_{t+1}</text>
  <rect x="870" y="335" width="285" height="90" class="box"/>
  <text x="1012" y="370" text-anchor="middle" class="txt">动作后果</text>
  <text x="1012" y="398" text-anchor="middle" class="small">成功 / 接触 / 风险</text>
  <rect x="870" y="520" width="285" height="90" class="box"/>
  <text x="1012" y="555" text-anchor="middle" class="txt">未来表示目标</text>
  <text x="1012" y="583" text-anchor="middle" class="small">表示空间对齐</text>

  <path d="M315 220 L425 185" class="arrow"/>
  <path d="M315 220 C360 300 375 350 425 375" class="arrow"/>
  <path d="M315 220 C360 420 370 520 425 565" class="arrow"/>
  <path d="M735 185 L870 215" class="arrow"/>
  <path d="M735 375 L870 380" class="arrow"/>
  <path d="M735 565 L870 565" class="arrow"/>
  <text x="320" y="365" class="small">动作 a_t / 动作块 A_t</text>
  <text x="640" y="675" text-anchor="middle" class="small">读法：WM 更一般，WAM 强调动作条件，JEPA 强调预测表示而不是像素重建。</text>
</svg>