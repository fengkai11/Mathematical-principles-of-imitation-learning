  <text x="600" y="86" text-anchor="middle" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif" fill="#555">GAIL 关注的是闭环执行后“常去哪里、常做什么”的状态—动作访问分布</text>

