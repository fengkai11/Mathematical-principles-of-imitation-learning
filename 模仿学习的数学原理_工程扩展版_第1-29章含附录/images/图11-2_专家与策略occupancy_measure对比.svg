  <text x="600" y="618" text-anchor="middle" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif" fill="#333">目标：让 ρ_π(s,a) 接近 ρ_E(s,a)，而不只是让单步动作标签相似</text>
