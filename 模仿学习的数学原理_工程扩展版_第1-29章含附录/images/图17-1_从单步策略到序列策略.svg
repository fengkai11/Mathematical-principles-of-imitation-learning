<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-size="28" font-family="Arial, 'Microsoft YaHei', sans-serif" font-weight="700">图17-1 从单步策略到序列策略</text>
  <rect x="70" y="105" width="420" height="310" rx="22" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <text x="280" y="145" text-anchor="middle" font-size="24" font-family="Arial, 'Microsoft YaHei', sans-serif" font-weight="700">单步策略</text>
  <rect x="130" y="195" width="120" height="62" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="190" y="233" text-anchor="middle" font-size="22" font-family="Arial">s_t / o_t</text>
  <path d="M260 226 L320 226" stroke="#24292f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="330" y="185" width="100" height="82" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="380" y="217" text-anchor="middle" font-size="20" font-family="Arial">πθ</text>
  <text x="380" y="244" text-anchor="middle" font-size="16" font-family="Arial, 'Microsoft YaHei', sans-serif">函数近似器</text>
  <path d="M380 276 L380 330" stroke="#24292f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="320" y="335" width="120" height="50" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="380" y="367" text-anchor="middle" font-size="22" font-family="Arial">a_t</text>
  <text x="280" y="455" text-anchor="middle" font-size="18" font-family="Arial, 'Microsoft YaHei', sans-serif" fill="#57606a">只问：当前观测下该做什么动作？</text>

  <rect x="610" y="105" width="420" height="310" rx="22" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <text x="820" y="145" text-anchor="middle" font-size="24" font-family="Arial, 'Microsoft YaHei', sans-serif" font-weight="700">序列策略</text>
  <rect x="655" y="188" width="260" height="66" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="785" y="215" text-anchor="middle" font-size="18" font-family="Arial">history: s≤t, a&lt;t</text>
  <text x="785" y="239" text-anchor="middle" font-size="16" font-family="Arial, 'Microsoft YaHei', sans-serif">历史状态、动作、目标条件</text>
  <path d="M925 221 L960 221" stroke="#24292f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="960" y="183" width="50" height="76" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="985" y="229" text-anchor="middle" font-size="20" font-family="Arial">a_t</text>
  <rect x="675" y="305" width="290" height="62" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="820" y="331" text-anchor="middle" font-size="17" font-family="Arial, 'Microsoft YaHei', sans-serif">πθ(a_t | context)</text>
  <text x="820" y="354" text-anchor="middle" font-size="15" font-family="Arial, 'Microsoft YaHei', sans-serif">条件序列模型</text>
  <text x="820" y="455" text-anchor="middle" font-size="18" font-family="Arial, 'Microsoft YaHei', sans-serif" fill="#57606a">追问：给定历史与任务目标，下一步怎样继续？</text>

  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24292f"/></marker></defs>
</svg>