<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .title { font: 700 28px sans-serif; fill: #222; }
      .subtitle { font: 18px sans-serif; fill: #555; }
      .box-title { font: 700 21px sans-serif; fill: #222; }
      .text { font: 17px sans-serif; fill: #333; }
      .small { font: 15px sans-serif; fill: #555; }
      .formula { font: 18px serif; fill: #222; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 18; }
      .slow { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 18; }
      .fast { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 18; }
      .safe { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 18; }
      .arrow { stroke: #333; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #666; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">图23-1 快慢模型双系统架构</text>
  <text x="550" y="73" text-anchor="middle" class="subtitle">慢模型负责理解、预测和规划；快模型负责低延迟、连续、稳定地执行动作</text>

  <rect x="70" y="125" width="250" height="120" class="box"/>
  <text x="195" y="160" text-anchor="middle" class="box-title">输入条件</text>
  <text x="95" y="195" class="text">语言指令 q</text>
  <text x="95" y="222" class="text">图像 / 状态观测 o</text>

  <rect x="425" y="105" width="270" height="170" class="slow"/>
  <text x="560" y="142" text-anchor="middle" class="box-title">慢模型</text>
  <text x="455" y="177" class="text">VLA / World Model / Planner</text>
  <text x="455" y="205" class="text">低频更新：k</text>
  <text x="455" y="235" class="formula">h_k → u_k → z_k</text>

  <rect x="800" y="125" width="230" height="120" class="box"/>
  <text x="915" y="160" text-anchor="middle" class="box-title">高层条件</text>
  <text x="828" y="195" class="text">子目标 / 技能</text>
  <text x="828" y="222" class="text">latent intention z_k</text>

  <rect x="425" y="365" width="270" height="160" class="fast"/>
  <text x="560" y="402" text-anchor="middle" class="box-title">快模型</text>
  <text x="455" y="437" class="text">ACT / Diffusion / Flow / SSM</text>
  <text x="455" y="465" class="text">高频执行：t</text>
  <text x="455" y="495" class="formula">πθ(a_t | o_{t-L:t}, z_k)</text>

  <rect x="800" y="385" width="230" height="120" class="safe"/>
  <text x="915" y="420" text-anchor="middle" class="box-title">安全与控制</text>
  <text x="828" y="455" class="text">限幅 / 碰撞检测</text>
  <text x="828" y="482" class="text">fallback / 接管</text>

  <rect x="70" y="385" width="250" height="120" class="box"/>
  <text x="195" y="420" text-anchor="middle" class="box-title">真实机器人</text>
  <text x="95" y="455" class="text">连续动作 / 动作块</text>
  <text x="95" y="482" class="text">闭环观测反馈</text>

  <path d="M320 185 C360 185 380 185 425 185" class="arrow"/>
  <path d="M695 185 C735 185 760 185 800 185" class="arrow"/>
  <path d="M915 245 C915 320 760 380 695 430" class="dash"/>
  <path d="M425 445 C380 445 360 445 320 445" class="arrow"/>
  <path d="M695 445 C735 445 760 445 800 445" class="arrow"/>
  <path d="M195 385 C195 320 130 285 130 245" class="dash"/>

  <text x="352" y="171" class="small">任务理解</text>
  <text x="721" y="171" class="small">输出条件</text>
  <text x="735" y="360" class="small">条件下发</text>
  <text x="332" y="432" class="small">动作执行</text>
  <text x="708" y="432" class="small">安全仲裁</text>
  <text x="78" y="315" class="small">观测回流</text>

  <text x="550" y="590" text-anchor="middle" class="subtitle">读者要记住：快慢模型的关键不是“两个模型”，而是时间尺度、职责边界和通信接口。</text>
</svg>
