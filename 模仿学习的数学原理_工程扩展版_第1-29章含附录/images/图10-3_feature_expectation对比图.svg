<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill:#222; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill:#555; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; fill:#555; }
      .axis { stroke:#333; stroke-width:2; }
      .grid { stroke:#ddd; stroke-width:1; }
      .expert { fill:#4c78a8; }
      .model { fill:#f58518; }
      .box { fill:#f8f9fb; stroke:#333; stroke-width:2; rx:16; }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="620" fill="#fff"/>
  <text x="550" y="48" text-anchor="middle" class="title">图10-3 feature expectation：比较的是闭环轨迹统计</text>
  <text x="550" y="82" text-anchor="middle" class="subtitle">不要求每一步动作完全一样，而是比较策略执行后形成的平均行为特征。</text>

  <rect x="70" y="120" width="960" height="390" class="box"/>
  <line x1="170" y1="430" x2="930" y2="430" class="axis"/>
  <line x1="170" y1="170" x2="170" y2="430" class="axis"/>
  <line x1="170" y1="365" x2="930" y2="365" class="grid"/>
  <line x1="170" y1="300" x2="930" y2="300" class="grid"/>
  <line x1="170" y1="235" x2="930" y2="235" class="grid"/>

  <text x="125" y="180" text-anchor="middle" class="small">高</text>
  <text x="125" y="430" text-anchor="middle" class="small">低</text>

  <g>
    <rect x="235" y="225" width="38" height="205" class="expert"/>
    <rect x="280" y="285" width="38" height="145" class="model"/>
    <text x="276" y="462" text-anchor="middle" class="small">安全距离</text>
  </g>
  <g>
    <rect x="395" y="250" width="38" height="180" class="expert"/>
    <rect x="440" y="195" width="38" height="235" class="model"/>
    <text x="436" y="462" text-anchor="middle" class="small">接近速度</text>
  </g>
  <g>
    <rect x="555" y="245" width="38" height="185" class="expert"/>
    <rect x="600" y="315" width="38" height="115" class="model"/>
    <text x="596" y="462" text-anchor="middle" class="small">姿态对齐</text>
  </g>
  <g>
    <rect x="715" y="215" width="38" height="215" class="expert"/>
    <rect x="760" y="260" width="38" height="170" class="model"/>
    <text x="756" y="462" text-anchor="middle" class="small">放置成功</text>
  </g>

  <rect x="340" y="530" width="22" height="22" class="expert"/>
  <text x="372" y="548" class="label">专家特征期望 μ_E</text>
  <rect x="610" y="530" width="22" height="22" class="model"/>
  <text x="642" y="548" class="label">模型特征期望 μ_w</text>

  <text x="550" y="590" text-anchor="middle" class="subtitle">IRL 的训练方向：让模型轨迹统计逐步接近专家轨迹统计。</text>
</svg>
