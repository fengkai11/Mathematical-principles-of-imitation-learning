<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-size="28" font-family="Arial, 'Microsoft YaHei', sans-serif" font-weight="700" fill="#1f2937">图22-3 预测—筛选—安全仲裁链路</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#334155; stroke-width:2; rx:18; ry:18; }
      .main { font-family:Arial, 'Microsoft YaHei', sans-serif; font-size:20px; font-weight:700; fill:#111827; }
      .sub { font-family:Arial, 'Microsoft YaHei', sans-serif; font-size:15px; fill:#374151; }
      .small { font-family:Arial, 'Microsoft YaHei', sans-serif; font-size:14px; fill:#4b5563; }
      .arrow { stroke:#374151; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#6b7280; stroke-width:2; fill:none; stroke-dasharray:7 6; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="50" y="135" width="180" height="115"/>
  <text class="main" x="140" y="176" text-anchor="middle">候选动作块</text>
  <text class="sub" x="140" y="207" text-anchor="middle">Diffusion / Flow / VLA</text>
  <text class="small" x="140" y="232" text-anchor="middle">生成多个 A_t^(j)</text>

  <path class="arrow" d="M230 192 L305 192"/>

  <rect class="box" x="305" y="135" width="190" height="115"/>
  <text class="main" x="400" y="176" text-anchor="middle">WAM rollout</text>
  <text class="sub" x="400" y="207" text-anchor="middle">预测未来 latent</text>
  <text class="small" x="400" y="232" text-anchor="middle">z_hat, risk, uncertainty</text>

  <path class="arrow" d="M495 192 L570 192"/>

  <rect class="box" x="570" y="135" width="190" height="115"/>
  <text class="main" x="665" y="176" text-anchor="middle">代价 / 风险评估</text>
  <text class="sub" x="665" y="207" text-anchor="middle">任务代价 + 安全风险</text>
  <text class="small" x="665" y="232" text-anchor="middle">J(A), r, e, u</text>

  <path class="arrow" d="M760 192 L835 192"/>

  <rect class="box" x="835" y="135" width="190" height="115"/>
  <text class="main" x="930" y="176" text-anchor="middle">安全仲裁器</text>
  <text class="sub" x="930" y="207" text-anchor="middle">阈值 / 规则 / 约束</text>
  <text class="small" x="930" y="232" text-anchor="middle">执行、降级或拒绝</text>

  <path class="arrow" d="M1025 171 L1110 130"/>
  <path class="arrow" d="M1025 213 L1110 258"/>

  <rect class="box" x="1110" y="75" width="70" height="85"/>
  <text class="main" x="1145" y="115" text-anchor="middle" font-size="18">执行</text>
  <text class="small" x="1145" y="140" text-anchor="middle">低风险</text>

  <rect class="box" x="1110" y="240" width="70" height="85"/>
  <text class="main" x="1145" y="280" text-anchor="middle" font-size="18">fallback</text>
  <text class="small" x="1145" y="305" text-anchor="middle">高风险</text>

  <path class="dash" d="M930 250 C890 355 710 390 400 390 C250 390 150 335 140 250"/>
  <text class="sub" x="570" y="420" text-anchor="middle">执行反馈回流：真实观测、预测误差、接管片段进入数据闭环</text>

  <rect x="64" y="315" width="235" height="60" rx="12" fill="#eef2ff" stroke="#6366f1"/>
  <text class="sub" x="181" y="340" text-anchor="middle">核心问题</text>
  <text class="small" x="181" y="363" text-anchor="middle">不是只预测未来，而是用预测改变决策</text>
</svg>
