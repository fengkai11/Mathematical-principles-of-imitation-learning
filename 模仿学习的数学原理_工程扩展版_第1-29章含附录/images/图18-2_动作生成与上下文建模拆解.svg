<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#24292f"/>
    </marker>
  </defs>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700">图18-2 策略架构拆解：上下文编码器 + 动作解码器</text>
    <text x="600" y="86" text-anchor="middle" font-size="18" fill="#57606a">先判断问题发生在“理解上下文”，还是发生在“生成动作”</text>

    <rect x="70" y="150" width="270" height="320" rx="22" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
    <text x="205" y="192" text-anchor="middle" font-size="24" font-weight="700">任务输入</text>
    <text x="205" y="240" text-anchor="middle" font-size="18" fill="#57606a">当前图像</text>
    <text x="205" y="278" text-anchor="middle" font-size="18" fill="#57606a">历史状态</text>
    <text x="205" y="316" text-anchor="middle" font-size="18" fill="#57606a">历史动作</text>
    <text x="205" y="354" text-anchor="middle" font-size="18" fill="#57606a">语言指令</text>
    <text x="205" y="392" text-anchor="middle" font-size="18" fill="#57606a">目标条件</text>

    <path d="M345 310 L430 310" stroke="#24292f" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="440" y="140" width="320" height="340" rx="24" fill="#ffffff" stroke="#24292f" stroke-width="3"/>
    <text x="600" y="188" text-anchor="middle" font-size="25" font-weight="700">Context Encoder</text>
    <text x="600" y="224" text-anchor="middle" font-size="18" fill="#57606a">建模上下文</text>
    <line x1="485" y1="250" x2="715" y2="250" stroke="#d0d7de" stroke-width="2"/>
    <text x="600" y="292" text-anchor="middle" font-size="17">Transformer / causal attention</text>
    <text x="600" y="328" text-anchor="middle" font-size="17">RNN / SSM / Mamba</text>
    <text x="600" y="364" text-anchor="middle" font-size="17">VLA 多模态融合</text>
    <text x="600" y="410" text-anchor="middle" font-size="17" fill="#57606a">输出：任务上下文表示 c_t</text>

    <path d="M765 310 L850 310" stroke="#24292f" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="860" y="140" width="270" height="340" rx="24" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
    <text x="995" y="188" text-anchor="middle" font-size="25" font-weight="700">Action Decoder</text>
    <text x="995" y="224" text-anchor="middle" font-size="18" fill="#57606a">生成动作</text>
    <line x1="905" y1="250" x2="1085" y2="250" stroke="#d0d7de" stroke-width="2"/>
    <text x="995" y="292" text-anchor="middle" font-size="17">BC / 连续动作头</text>
    <text x="995" y="328" text-anchor="middle" font-size="17">ACT / 动作块</text>
    <text x="995" y="364" text-anchor="middle" font-size="17">Diffusion / Flow</text>
    <text x="995" y="410" text-anchor="middle" font-size="17" fill="#57606a">输出：a_t 或 A_t</text>

    <rect x="210" y="520" width="780" height="58" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <text x="600" y="556" text-anchor="middle" font-size="18" fill="#24292f">工程判断：上下文不够就升级 Encoder，动作多模态就升级 Decoder，不要只按模型热度选型</text>
  </g>
</svg>
