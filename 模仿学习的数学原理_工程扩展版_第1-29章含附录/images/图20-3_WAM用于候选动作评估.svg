<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24292f"/></marker>
    <style>
      .title{font:700 30px Arial,'Microsoft YaHei',sans-serif;fill:#24292f}.sub{font:18px Arial,'Microsoft YaHei',sans-serif;fill:#57606a}
      .box{fill:#f6f8fa;stroke:#8c959f;stroke-width:2;rx:16;ry:16}.policy{fill:#ddf4ff;stroke:#0969da;stroke-width:2;rx:16;ry:16}.wam{fill:#fff8c5;stroke:#9a6700;stroke-width:2;rx:16;ry:16}.ok{fill:#dafbe1;stroke:#1a7f37;stroke-width:2;rx:16;ry:16}.bad{fill:#ffebe9;stroke:#cf222e;stroke-width:2;rx:16;ry:16}
      .txt{font:18px Arial,'Microsoft YaHei',sans-serif;fill:#24292f}.small{font:15px Arial,'Microsoft YaHei',sans-serif;fill:#57606a}.formula{font:16px Arial,'Microsoft YaHei',sans-serif;fill:#6e7781}.arrow{stroke:#24292f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="640" y="46" text-anchor="middle" class="title">图20-3 WAM 用于候选动作评估</text>
  <text x="640" y="80" text-anchor="middle" class="sub">动作策略提出候选动作块，WAM 预测后果，评估器选择更安全的动作</text>

  <rect x="70" y="155" width="220" height="120" class="box"/>
  <text x="180" y="195" text-anchor="middle" class="txt">当前上下文</text>
  <text x="180" y="226" text-anchor="middle" class="formula">h_t, c_t</text>

  <rect x="370" y="155" width="240" height="120" class="policy"/>
  <text x="490" y="195" text-anchor="middle" class="txt">动作策略 / VLA</text>
  <text x="490" y="226" text-anchor="middle" class="small">提出多个候选动作块</text>

  <rect x="715" y="110" width="210" height="80" class="box"/>
  <text x="820" y="142" text-anchor="middle" class="txt">候选 A</text>
  <text x="820" y="168" text-anchor="middle" class="formula">A_t^1</text>
  <rect x="715" y="220" width="210" height="80" class="box"/>
  <text x="820" y="252" text-anchor="middle" class="txt">候选 B</text>
  <text x="820" y="278" text-anchor="middle" class="formula">A_t^2</text>
  <rect x="715" y="330" width="210" height="80" class="box"/>
  <text x="820" y="362" text-anchor="middle" class="txt">候选 C</text>
  <text x="820" y="388" text-anchor="middle" class="formula">A_t^3</text>

  <rect x="70" y="440" width="340" height="125" class="wam"/>
  <text x="240" y="480" text-anchor="middle" class="txt">World Action Model</text>
  <text x="240" y="512" text-anchor="middle" class="formula">p(h_{t+1:t+H}|h_t,A_t,c_t)</text>
  <text x="240" y="543" text-anchor="middle" class="small">预测每个候选动作块的未来后果</text>

  <rect x="520" y="440" width="270" height="125" class="box"/>
  <text x="655" y="480" text-anchor="middle" class="txt">风险 / 目标评估器</text>
  <text x="655" y="512" text-anchor="middle" class="small">成功概率、碰撞、卡滞</text>
  <text x="655" y="543" text-anchor="middle" class="small">目标距离、预测误差</text>

  <rect x="900" y="440" width="250" height="125" class="ok"/>
  <text x="1025" y="480" text-anchor="middle" class="txt">选择动作</text>
  <text x="1025" y="512" text-anchor="middle" class="small">执行低风险候选</text>
  <text x="1025" y="543" text-anchor="middle" class="small">或触发重规划 / fallback</text>

  <path d="M290 215 L370 215" class="arrow"/>
  <path d="M610 215 C660 165 690 150 715 150" class="arrow"/>
  <path d="M610 215 L715 260" class="arrow"/>
  <path d="M610 215 C660 305 690 360 715 370" class="arrow"/>
  <path d="M820 410 C690 470 520 500 410 502" class="arrow"/>
  <path d="M410 502 L520 502" class="arrow"/>
  <path d="M790 502 L900 502" class="arrow"/>
  <path d="M180 275 C160 330 180 390 220 440" class="arrow"/>

  <rect x="945" y="135" width="230" height="120" class="bad"/>
  <text x="1060" y="174" text-anchor="middle" class="txt">被筛掉的候选</text>
  <text x="1060" y="208" text-anchor="middle" class="small">高碰撞 / 高卡滞风险</text>
  <text x="1060" y="236" text-anchor="middle" class="small">或目标收益不足</text>

  <text x="640" y="655" text-anchor="middle" class="small">关键：WAM 不是直接控制器，而是候选动作的后果评估器。</text>
</svg>