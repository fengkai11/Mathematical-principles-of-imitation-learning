<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <style>
      .title { font: bold 24px sans-serif; fill:#222; }
      .label { font: 18px sans-serif; fill:#222; }
      .small { font: 15px sans-serif; fill:#444; }
      .panel { fill:#f9f9f9; stroke:#888; stroke-width:1.5; rx:10; }
    </style>
  </defs>
  <text x="40" y="40" class="title">图1-6 模仿学习总目标</text>
  <rect x="60" y="90" width="320" height="190" class="panel"/>
  <text x="140" y="125" class="label">专家执行分布 ρE</text>
  <text x="95" y="165" class="small">专家通常把方块推到：</text>
  <text x="115" y="195" class="small">• 正常推进路径</text>
  <text x="115" y="220" class="small">• 槽口正前方</text>
  <text x="115" y="245" class="small">• 必要时做稳定微调</text>
  <rect x="580" y="90" width="320" height="190" class="panel"/>
  <text x="650" y="125" class="label">学习策略分布 ρπ</text>
  <text x="615" y="165" class="small">学习策略执行后可能：</text>
  <text x="635" y="195" class="small">• 接近专家分布</text>
  <text x="635" y="220" class="small">• 偏到槽口边缘</text>
  <text x="635" y="245" class="small">• 进入卡滞状态</text>
  <line x1="390" y1="185" x2="570" y2="185" stroke="#333" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="415" y="160" class="small">让两者尽量接近</text>
  <text x="405" y="215" class="small">min D(ρπ, ρE)</text>
  <text x="80" y="325" class="small">核心思想：模仿学习不仅要模仿专家动作，还要让学习策略闭环执行后的整体行为分布接近专家。</text>
</svg>
