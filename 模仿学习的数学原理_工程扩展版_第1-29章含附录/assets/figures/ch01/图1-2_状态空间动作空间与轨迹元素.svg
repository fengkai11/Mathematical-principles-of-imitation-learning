<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <style>
      text { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#222; }
      .title{font-size:26px;font-weight:700}.label{font-size:18px}.small{font-size:15px;fill:#444}.box{fill:#fff;stroke:#d8d8d8;stroke-width:2}.arrow{stroke:#333;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="40" y="45" class="title">图1-2：状态空间、动作空间与轨迹元素</text>
  <text x="40" y="78" class="small">状态 s 和动作 a 是轨迹、策略、训练样本与 occupancy 的基本元素。</text>

  <rect x="70" y="130" width="240" height="150" rx="14" class="box"/>
  <text x="105" y="165" class="label">状态空间 𝒮</text>
  <text x="105" y="205" class="small">s ∈ 𝒮</text>
  <text x="105" y="235" class="small">二维机器人：s=(x,y)</text>

  <rect x="590" y="130" width="240" height="150" rx="14" class="box"/>
  <text x="625" y="165" class="label">动作空间 𝒜</text>
  <text x="625" y="205" class="small">a ∈ 𝒜</text>
  <text x="625" y="235" class="small">移动动作：a=(Δx,Δy)</text>

  <rect x="330" y="300" width="240" height="110" rx="14" fill="#f7fbff" stroke="#bcd5ff" stroke-width="2"/>
  <text x="365" y="335" class="label">状态—动作对</text>
  <text x="370" y="374" class="small">(s,a) ∈ 𝒮 × 𝒜</text>

  <line x1="310" y1="215" x2="430" y2="300" class="arrow"/>
  <line x1="590" y1="215" x2="470" y2="300" class="arrow"/>

  <rect x="160" y="430" width="580" height="45" rx="10" fill="#fff7e8" stroke="#f0c36a"/>
  <text x="182" y="458" class="small">轨迹由多个状态—动作对按时间顺序连接：τ=(s₁,a₁,s₂,a₂,…,s_T,a_T,s_{T+1})</text>
</svg>
