<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #222; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 18px; }
      .small { font-size: 15px; fill: #444; }
      .axis { stroke:#555; stroke-width:2; }
      .grid { stroke:#e8e8e8; stroke-width:1; }
      .expert { stroke:#2f6fdd; stroke-width:5; fill:none; }
      .learned { stroke:#d96c2c; stroke-width:4; fill:none; stroke-dasharray:8 7; }
      .point { stroke:#222; stroke-width:2; }
    </style>
  </defs>

  <text x="40" y="45" class="title">图1-1：二维机器人从起点走到目标</text>
  <text x="40" y="78" class="small">贯穿例子：状态是当前位置，动作是下一步移动，专家轨迹给出从起点到目标的示范路径。</text>

  <rect x="60" y="110" width="540" height="330" rx="10" fill="#fafafa" stroke="#ddd"/>

  <g>
    <line x1="100" y1="400" x2="560" y2="400" class="axis" marker-end="url(#arrow)"/>
    <line x1="100" y1="400" x2="100" y2="140" class="axis" marker-end="url(#arrow)"/>
    <text x="568" y="405" class="small">x</text>
    <text x="92" y="132" class="small">y</text>
    <g>
      <line x1="160" y1="140" x2="160" y2="400" class="grid"/>
      <line x1="220" y1="140" x2="220" y2="400" class="grid"/>
      <line x1="280" y1="140" x2="280" y2="400" class="grid"/>
      <line x1="340" y1="140" x2="340" y2="400" class="grid"/>
      <line x1="400" y1="140" x2="400" y2="400" class="grid"/>
      <line x1="460" y1="140" x2="460" y2="400" class="grid"/>
      <line x1="520" y1="140" x2="520" y2="400" class="grid"/>
      <line x1="100" y1="340" x2="560" y2="340" class="grid"/>
      <line x1="100" y1="280" x2="560" y2="280" class="grid"/>
      <line x1="100" y1="220" x2="560" y2="220" class="grid"/>
      <line x1="100" y1="160" x2="560" y2="160" class="grid"/>
    </g>
  </g>

  <path d="M130 365 C190 330, 235 305, 300 280 C370 250, 430 210, 525 165" class="expert" marker-end="url(#arrow)"/>
  <path d="M130 365 C200 345, 250 350, 315 332 C390 310, 452 270, 535 220" class="learned" marker-end="url(#arrow)"/>

  <circle cx="130" cy="365" r="11" fill="#6ec17b" class="point"/>
  <text x="95" y="392" class="label">起点</text>
  <circle cx="525" cy="165" r="13" fill="#ffcc4d" class="point"/>
  <text x="535" y="160" class="label">目标</text>
  <circle cx="535" cy="220" r="9" fill="#d96c2c" class="point"/>
  <text x="545" y="226" class="small">走偏后的状态</text>

  <rect x="640" y="135" width="210" height="250" rx="12" fill="#fff" stroke="#ddd"/>
  <text x="662" y="170" class="label">数学对象</text>
  <text x="662" y="210" class="small">状态：s=(x,y)</text>
  <text x="662" y="242" class="small">动作：a=(Δx,Δy)</text>
  <text x="662" y="274" class="small">专家轨迹：τ</text>
  <text x="662" y="306" class="small">学习策略：πθ(a|s)</text>
  <text x="662" y="338" class="small">闭环结果：ρπ</text>

  <line x1="640" y1="410" x2="690" y2="410" class="expert"/>
  <text x="704" y="416" class="small">专家路径</text>
  <line x1="640" y1="445" x2="690" y2="445" class="learned"/>
  <text x="704" y="451" class="small">学习策略路径</text>
</svg>
