<svg xmlns="http://www.w3.org/2000/svg" width="940" height="320" viewBox="0 0 940 320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <style>
      .title { font: bold 24px sans-serif; fill:#222; }
      .label { font: 18px sans-serif; fill:#222; }
      .small { font: 15px sans-serif; fill:#444; }
      .node { fill:#f9f9f9; stroke:#888; stroke-width:1.5; rx:8; }
    </style>
  </defs>
  <text x="40" y="40" class="title">图1-4 闭环执行：策略与环境共同生成轨迹</text>
  <rect x="40" y="120" width="140" height="60" class="node"/>
  <text x="70" y="156" class="label">状态 s_t</text>
  <text x="45" y="205" class="small">方块位置 / 姿态 / 接触关系</text>
  <rect x="240" y="120" width="170" height="60" class="node"/>
  <text x="275" y="156" class="label">策略 πθ(a|s)</text>
  <rect x="470" y="120" width="130" height="60" class="node"/>
  <text x="505" y="156" class="label">动作 a_t</text>
  <text x="455" y="205" class="small">向前推 / 侧向修正 / 退让</text>
  <rect x="660" y="120" width="180" height="60" class="node"/>
  <text x="710" y="156" class="label">环境转移</text>
  <text x="650" y="205" class="small">方块移动、旋转、接触变化</text>
  <line x1="180" y1="150" x2="240" y2="150" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="410" y1="150" x2="470" y2="150" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="150" x2="660" y2="150" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M840 150 C900 150, 900 60, 120 60 C60 60, 60 100, 60 120" fill="none" stroke="#d64545" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="560" y="72" class="small">下一状态 s_{t+1} 再次进入策略，形成闭环</text>
  <text x="60" y="270" class="small">关键点：动作会改变下一步输入，所以模仿学习不是普通的独立样本预测问题。</text>
</svg>
