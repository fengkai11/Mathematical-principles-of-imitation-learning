<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill:#222; }
      .label { font: 18px sans-serif; fill:#222; }
      .small { font: 15px sans-serif; fill:#444; }
      .panel { fill:#f9f9f9; stroke:#888; stroke-width:1.5; rx:10; }
    </style>
  </defs>
  <text x="40" y="40" class="title">图1-5 状态访问分布与占用分布</text>
  <rect x="40" y="70" width="390" height="290" class="panel"/>
  <text x="145" y="105" class="label">状态访问分布 dπ(s)</text>
  <circle cx="120" cy="180" r="28" fill="#cfe8ff" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="220" cy="180" r="38" fill="#9fd0ff" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="330" cy="180" r="50" fill="#6fb7ff" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="230" class="small">正常推进状态</text>
  <text x="182" y="235" class="small">轻微偏差状态</text>
  <text x="298" y="245" class="small">边缘 / 卡滞状态</text>
  <text x="70" y="300" class="small">dπ(s) 描述：策略执行后，方块更常出现在哪些状态。</text>
  <rect x="500" y="70" width="420" height="290" class="panel"/>
  <text x="610" y="105" class="label">状态—动作执行分布 ρπ(s,a)</text>
  <rect x="560" y="145" width="100" height="50" fill="#e8f4ff" stroke="#4a90e2"/>
  <text x="580" y="175" class="small">状态 s</text>
  <text x="685" y="178" class="label">+</text>
  <rect x="730" y="145" width="120" height="50" fill="#fff4db" stroke="#d19a00"/>
  <text x="755" y="175" class="small">动作 a</text>
  <text x="570" y="245" class="small">ρπ(s,a)=dπ(s)π(a|s)</text>
  <text x="545" y="285" class="small">不仅看“方块会到哪里”，还看“到了那里怎么推”。</text>
  <text x="70" y="390" class="small">在推块入槽里：若策略总把方块推到槽口边缘，dπ(s) 已偏离专家；若到了边缘还继续硬推，ρπ(s,a) 会更偏离专家。</text>
</svg>
