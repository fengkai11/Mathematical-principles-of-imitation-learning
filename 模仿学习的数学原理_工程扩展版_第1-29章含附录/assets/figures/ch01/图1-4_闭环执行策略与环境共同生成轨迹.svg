<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#222}.title{font-size:26px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px;fill:#444}.box{fill:#fff;stroke:#ddd;stroke-width:2}.state{fill:#eef7ff;stroke:#8ab6e8}.action{fill:#fff3e6;stroke:#e8b36c}.env{fill:#f2f8ed;stroke:#9ac57d}.arrow{stroke:#333;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="40" y="45" class="title">图1-4：闭环执行：策略与环境共同生成轨迹</text>
  <text x="40" y="78" class="small">策略选择动作，环境根据动作产生下一状态；下一状态又成为策略的新输入。</text>

  <rect x="70" y="170" width="150" height="80" rx="14" class="box state"/>
  <text x="115" y="205" class="label">状态 s_t</text>
  <text x="103" y="232" class="small">当前位置</text>

  <rect x="290" y="170" width="190" height="80" rx="14" class="box action"/>
  <text x="326" y="202" class="label">策略 π(a|s_t)</text>
  <text x="337" y="232" class="small">采样动作 a_t</text>

  <rect x="550" y="170" width="190" height="80" rx="14" class="box env"/>
  <text x="596" y="202" class="label">环境转移</text>
  <text x="585" y="232" class="small">P(s_{t+1}|s_t,a_t)</text>

  <rect x="360" y="330" width="170" height="80" rx="14" class="box state"/>
  <text x="395" y="365" class="label">状态 s_{t+1}</text>
  <text x="395" y="392" class="small">下一步输入</text>

  <line x1="220" y1="210" x2="290" y2="210" class="arrow"/>
  <line x1="480" y1="210" x2="550" y2="210" class="arrow"/>
  <path d="M645 250 C640 330, 560 370, 530 370" fill="none" class="arrow"/>
  <path d="M360 370 C250 365, 150 305, 145 250" fill="none" class="arrow"/>

  <rect x="105" y="92" width="690" height="45" rx="10" fill="#f8f8f8" stroke="#ddd"/>
  <text x="130" y="121" class="small">闭环含义：模型输出动作会改变未来输入，因此模仿学习不是普通静态监督学习。</text>
</svg>
