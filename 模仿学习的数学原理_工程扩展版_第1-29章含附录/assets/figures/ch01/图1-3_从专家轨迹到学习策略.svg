<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#222}.title{font-size:26px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px;fill:#444}.box{fill:#fff;stroke:#ddd;stroke-width:2}.blue{fill:#f2f7ff;stroke:#9ec1ff}.orange{fill:#fff7ec;stroke:#f0bc70}.arrow{stroke:#333;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="40" y="45" class="title">图1-3：从专家轨迹到学习策略</text>
  <text x="40" y="78" class="small">专家数据 D_E 是有限轨迹样本，学习目标是得到能在状态上输出动作分布的策略 πθ(a|s)。</text>

  <rect x="55" y="130" width="230" height="220" rx="14" class="box blue"/>
  <text x="88" y="165" class="label">专家数据 D_E</text>
  <text x="86" y="205" class="small">τ₁=(s₁,a₁,…)</text>
  <text x="86" y="238" class="small">τ₂=(s₁,a₁,…)</text>
  <text x="86" y="271" class="small">τ₃=(s₁,a₁,…)</text>
  <text x="86" y="312" class="small">有限轨迹样本</text>

  <rect x="350" y="165" width="200" height="150" rx="14" class="box"/>
  <text x="390" y="200" class="label">训练</text>
  <text x="382" y="242" class="small">从 (s,a) 样本</text>
  <text x="382" y="272" class="small">学习参数 θ</text>

  <rect x="625" y="130" width="230" height="220" rx="14" class="box orange"/>
  <text x="660" y="165" class="label">学习策略</text>
  <text x="668" y="210" class="small">πθ(a|s)</text>
  <text x="656" y="252" class="small">输入状态 s</text>
  <text x="656" y="282" class="small">输出动作分布</text>
  <text x="656" y="312" class="small">用于闭环执行</text>

  <line x1="285" y1="240" x2="350" y2="240" class="arrow"/>
  <line x1="550" y1="240" x2="625" y2="240" class="arrow"/>

  <rect x="150" y="395" width="600" height="55" rx="12" fill="#f8f8f8" stroke="#ddd"/>
  <text x="180" y="430" class="small">关键区别：D_E 只是样本集合，πθ 是可在新状态上产生动作的决策规则。</text>
</svg>
