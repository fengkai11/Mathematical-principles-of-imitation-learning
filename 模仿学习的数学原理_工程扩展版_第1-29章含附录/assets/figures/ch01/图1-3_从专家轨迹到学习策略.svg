<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <style>
      .title { font: bold 24px sans-serif; fill:#222; }
      .label { font: 18px sans-serif; fill:#222; }
      .small { font: 15px sans-serif; fill:#444; }
      .panel { fill:#f9f9f9; stroke:#999; stroke-width:1.5; rx:10; }
    </style>
  </defs>
  <text x="40" y="40" class="title">图1-3 从专家轨迹到学习策略</text>
  <rect x="40" y="70" width="250" height="230" class="panel"/>
  <text x="90" y="105" class="label">有限专家轨迹</text>
  <text x="70" y="145" class="small">τ1：成功推入槽口</text>
  <text x="70" y="175" class="small">τ2：成功推入槽口</text>
  <text x="70" y="205" class="small">τ3：成功推入槽口</text>
  <text x="70" y="250" class="small">只覆盖一部分状态</text>
  <text x="70" y="275" class="small">未必包含推偏 / 卡滞 / 恢复</text>
  <rect x="335" y="110" width="250" height="150" class="panel"/>
  <text x="405" y="145" class="label">学习策略 πθ(a|s)</text>
  <text x="365" y="185" class="small">输入：当前推块状态 s</text>
  <text x="365" y="215" class="small">输出：下一步怎么推 a</text>
  <rect x="630" y="70" width="250" height="230" class="panel"/>
  <text x="700" y="105" class="label">闭环执行</text>
  <text x="660" y="145" class="small">正常状态：继续推进</text>
  <text x="660" y="175" class="small">偏差状态：修正 / 恢复</text>
  <text x="660" y="205" class="small">卡滞状态：退让 / 重新接触</text>
  <text x="660" y="250" class="small">策略必须覆盖自己会遇到的状态</text>
  <line x1="290" y1="185" x2="335" y2="185" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="585" y1="185" x2="630" y2="185" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="95" y="330" class="small">要点：专家给出的是有限轨迹，不是完整策略；学习策略需要在闭环执行中面对更多状态。</text>
</svg>
